<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="FLOWSTATE — Focus Better. Live Better. A serene digital wellness app for mindful focus, digital detox, and healthy sleep." />
    <title>FLOWSTATE — Focus Better. Live Better.</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#171A2E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F8FC" media="(prefers-color-scheme: light)" />

    <!-- iOS Standalone App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOWSTATE" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- Android / Universal App Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FLOWSTATE" />
    <meta name="msapplication-TileColor" content="#171A2E" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#A99BFF]/20 selection:text-[#171A2E]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('FLOWSTATE PWA ServiceWorker registered:', reg.scope))
            .catch((err) => console.warn('PWA ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
